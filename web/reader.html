<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookaudifier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="/" class="back" title="Library">
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg> Library
    </a>
    <h1 id="title"></h1>
    <button class="night-toggle" id="night" title="Dark pages (n)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0 1 13.36 3.1C12.92 3.04 12.46 3 12 3z"/></svg>
    </button>
    <div class="zoom">
      <button id="zoomOut" title="Smaller pages (−)">−</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomIn" title="Larger pages (+)">+</button>
    </div>
  </header>
  <main class="pages" id="pages"></main>

  <button class="jump" id="jump" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg> Back to reading
  </button>

  <footer class="player" id="player">
    <div class="scrub">
      <span id="elapsed">0:00</span>
      <input type="range" id="seek" min="0" value="0">
      <span id="total">0:00</span>
    </div>
    <div class="controls">
      <div class="left">
        <img class="thumb" id="thumb" alt="">
        <div class="now">
          <div class="now-title" id="nowTitle"></div>
          <div class="now-where" id="where"></div>
        </div>
      </div>
      <div class="buttons">
        <button id="prev" title="Previous sentence">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="back" class="skip" title="Back 10 seconds (←)">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><small>10</small>
        </button>
        <button id="play" class="play" title="Play / pause (space)">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="fwd" class="skip" title="Forward 10 seconds (→)">
          <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><small>10</small>
        </button>
        <button id="next" title="Next sentence">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="right">
        <select id="speed" title="Playback speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>
  </footer>
  <script src="reader.js"></script>
</body>
</html>
